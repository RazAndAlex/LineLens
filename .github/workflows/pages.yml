name: Landing page

# Publishes landing/ to GitHub Pages.
#
# Branch deployment only offers the repository root or /docs, and the landing
# page is neither: serving the root would publish the whole repository as a
# website, and /docs holds the ADRs. So the folder is uploaded as an artifact
# and deployed from there, which is the supported way to publish a subfolder.

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queue a new one rather than cancelling a run that
# is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload the landing folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
