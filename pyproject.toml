[project]
name = "linelens"
version = "0.1.1"
description = "Local-first diagnostics for industrial machine data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.3",
]
# pandas: CSV loading, cleaning, grouping, calculations (added M1/T1.1).
# License to be decided by the owner before any public release.

[project.optional-dependencies]
forecast = [
    "scikit-learn>=1.4",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",  # UploadFile / multipart form parsing (was transitive via streamlit)
]
# fastapi/uvicorn: the FastAPI+React UI (server/, api.py). Also mirrored into
# the dev group below: plain `uv run` installs default groups, not extras, and
# the constraint is that `uv run pytest` runs tests/test_api.py and
# `uv run python api.py` starts the server without naming --extra web.
# forecast: the learned forecast core (M8, ADR-0007) -- scikit-learn. Kept its own
# extra so `import linelens` (core) stays pandas-only and the core tests run ML-
# free; the UI pulls it because the future-line chart renders the forecast.
# tests/test_forecast_ml import-skips when sklearn is absent, so the default
# suite stays green.
# (ADR-0011: the Streamlit/plotly `ui` and playwright `browser` extras were
# retired with the old UI, archived under archive/streamlit-ui/.)

[dependency-groups]
dev = [
    "pytest",
    # mirrored from the `web` extra (see above) so plain `uv run` gets them.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",  # fastapi.testclient.TestClient transport (tests/test_api.py)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
